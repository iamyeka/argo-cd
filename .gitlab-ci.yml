stages:
  - package

before_script:
  - APP_REVISION="${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME##*/}-r$CI_PIPELINE_ID}"
  - REPOSITORY_PREFIX="harbor.yf-online.service.163.org/cloudnative/argocd/argoproj"

build:
  stage: package
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    REPO_NAME: cloudnative
    DOCKER_CONFIG_JSON: $DOCKER_AUTH_CONFIG_CN_EAST
  script:
    - |
      IMAGE="$REPOSITORY_PREFIX/argocd:$APP_REVISION"
      docker build --network=host --rm -f Dockerfile.netease -t $IMAGE .
      docker push $IMAGE
      docker rmi -f $IMAGE
  only:
    - /^feat\/.*$/
    - develop
    - tags
